services:
  mikrotik-watcher:
    image: brantwang/mikrotik-client-watcher:v0.0.1
    container_name: mikrotik-watcher
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - LOGIN_KEY=${LOGIN_KEY:-admin123}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      - DATA_DIR=/data
      - LOG_LEVEL=${LOG_LEVEL:-INFO}